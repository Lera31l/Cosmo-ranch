<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cosmo Ranch</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- TOP -->
    <header class="top">
      <div class="left">
        <div class="ava" id="ava">🛸</div>
        <div>
          <div class="nick" id="nick">Космонавт</div>
          <div class="lvl">Ур. <span id="plvl">1</span></div>
        </div>
      </div>
      <div class="currencies">
        <div class="cur" data-tip="Кристаллы"><span>💎</span><b id="c1">0</b></div>
        <div class="cur" data-tip="Пыль"><span>✨</span><b id="c2">0</b></div>
        <div class="cur energy" data-tip="Энергия"><span>⚡</span><b id="c3">0</b></div>
        <div class="cur stars"><span>⭐</span><b id="c4">0</b></div>
      </div>
    </header>

    <div class="xp"><div class="xp-bar" id="xpbar"></div></div>

    <!-- SCREENS -->
    <div id="screens">
      <!-- HOME -->
      <section class="sc active" id="sc-home">
        <div class="hero">
          <div class="rarity-tag" id="rtag">COMMON</div>
          <div class="hero-emoji" id="hemoji">🐣</div>
          <div class="hero-name" id="hname">Космо-Цып</div>
          <div class="hero-meta">LVL <span id="hlvl">1</span> · <span id="hincome">+1</span>/корм</div>

          <button class="tap-btn" id="tapBtn">
            <span class="tap-main">КОРМИТЬ</span>
            <span class="tap-sub">-1 ⚡</span>
          </button>

          <div class="bars">
            <div class="bar-row">
              <span>Сытость</span>
              <div class="bar"><div class="fill sat" id="satFill"></div></div>
              <span id="satVal">100%</span>
            </div>
            <div class="bar-row">
              <span>Энергия</span>
              <div class="bar"><div class="fill en" id="enFill"></div></div>
              <span id="enVal">30</span>
            </div>
          </div>
        </div>

        <div class="mini-row">
          <div class="mcard"><b id="pass">0</b><small>пассив/ч</small></div>
          <div class="mcard"><b id="own">1</b><small>существ</small></div>
          <div class="mcard"><b id="farmP">0</b><small>ферм</small></div>
        </div>
      </section>

      <!-- CREATURES -->
      <section class="sc" id="sc-creatures">
        <h2>👾 Существа</h2>
        <div class="tabs">
          <button class="tab on" data-t="my">Мои</button>
          <button class="tab" data-t="shop">Магазин</button>
          <button class="tab" data-t="breed">Разведение</button>
        </div>
        <div id="creaturesBox"></div>
      </section>

      <!-- FARM -->
      <section class="sc" id="sc-farm">
        <h2>🏭 Фермы</h2>
        <p class="sub">Разные типы добычи — от пыли до кристаллов</p>
        <div id="farmBox"></div>
      </section>

      <!-- QUESTS -->
      <section class="sc" id="sc-quests">
        <h2>📋 Задания</h2>
        <div class="daily" id="daily">
          <div class="d-title">🎁 Ежедневка</div>
          <div class="d-rew" id="dRew">+80 💎  +25 ⚡  +15 ✨</div>
          <button class="btn" id="claimD">Забрать</button>
        </div>
        <div id="questBox"></div>
      </section>

      <!-- PLAYERS (simulated) -->
      <section class="sc" id="sc-players">
        <h2>👥 Игроки</h2>
        <p class="sub">Топ и активность (демо-данные)</p>
        <div id="playersBox"></div>
      </section>

      <!-- STARS -->
      <section class="sc" id="sc-stars">
        <h2>⭐ Stars Shop</h2>
        <div id="starsBox"></div>
      </section>
    </div>

    <!-- NAV -->
    <nav class="nav">
      <button class="ni on" data-s="home"><span>🏠</span>Ранчо</button>
      <button class="ni" data-s="creatures"><span>👾</span>Существа</button>
      <button class="ni" data-s="farm"><span>🏭</span>Фермы</button>
      <button class="ni" data-s="quests"><span>📋</span>Задания</button>
      <button class="ni" data-s="players"><span>👥</span>Игроки</button>
      <button class="ni" data-s="stars"><span>⭐</span>Stars</button>
    </nav>
  </div>

  <div id="float" class="float"></div>
  <div id="particles"></div>

  <script src="game.js"></script>
</body>
</html>
